
name: Build Fresnel Calculator APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          mkdir extracted
          unzip -q FresnelCalculator_v0.2.0_source-1_updated.zip -d extracted
          rsync -a --exclude='.github/' extracted/ ./

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug
             -Pkotlin.jvm.target.validation.mode=warning

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: FresnelCalculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
